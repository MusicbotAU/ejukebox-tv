# ---------------------------------------------------------------------------
# THE FAQ - single source of truth for the home page ("tv") and /demo/ ("demo").
#
# The pages render the visible <details> lists from this file, and
# _includes/schema.html renders the FAQPage JSON-LD from the same rows. One
# edit, both stay true. A schema answer that no longer matches the visible
# answer is exactly the mismatch that gets structured data ignored.
#
# Each answer is a list of paragraphs. Every paragraph is written as a FOLDED
# BLOCK SCALAR - the "- >-" on its own line with the text indented beneath.
# That is not decoration: several answers contain a colon mid-sentence, and a
# plain inline string would be parsed by YAML as a mapping and emitted into the
# JSON-LD as literal garbage.
#
# Light inline HTML is allowed - <strong> and <a> only - because the visible
# page uses it. The JSON-LD strips it before it is written.
#
# NO PRICES. NO EMAIL ADDRESS. NO PHONE NUMBER. Not in a visible answer and not
# in the markup that is generated from it.
#
# WORDS THAT NEVER APPEAR (the September 2026 brief): automatic / automated /
# automatically (say "by itself", "switches itself"), kiosk, stream as a noun
# (the one allowed use is "the broadcasters' own live streams"), player (say
# "the eJukebox box"), "AI" outside the image disclosure, "smart", any
# exclamation mark, and any pay TV brand by name. Pay TV is "in discussion".
# ---------------------------------------------------------------------------

tv:
  - q: Who changes the channel at 7:30 on Friday?
    a:
      - >-
        Nobody. Set it once from the sport guide on the phone and the screen
        switches itself at kick-off, then goes back to your specials after the
        whistle. If you change your mind, tap a different channel, or Slideshow,
        or Mute. The phone always wins.

  - q: Where does the TV sound come out?
    a:
      - >-
        The TV, down the same lead as the picture. Never your music speakers.
        One volume for the music and one for the TV, both on the phone.

  - q: And the music? Does someone have to turn it down for the game?
    a:
      - >-
        No. Set the game with sound and at kick-off the TV comes up and the
        music goes quiet by itself. At the whistle the slideshow and the music
        come back where they were.
      - >-
        Want the music to keep playing through the game? Set the game silent
        instead.

  - q: We have ten screens, six on one thing and four on another. Can it do that?
    a:
      - >-
        Yes. Two groups, two rows on the phone. The six run off the eJukebox box
        into the splitter you already have. The four run off a small screen box
        behind that wall. Hardware once, nothing ongoing.

  - q: Same thing on all ten?
    a:
      - >-
        One lead into your splitter. Done. Every TV on the splitter follows the
        one tap.

  - q: What if two games overlap?
    a:
      - >-
        The app tells you before it saves: what is already on then, and that the
        new one would change the channel halfway through. You choose.

  - q: Does the request touchscreen show the TV?
    a:
      - >-
        No. It takes song requests and shows your photos and slides as its
        screensaver, the same as it always has. The TV goes on the wall screens.

  - q: Does it need the internet?
    a:
      - >-
        The same connection your eJukebox music uses. The channels are the
        broadcasters' own live streams, so there is no aerial to break up into
        blocks. If the wifi at the far end of the room is patchy, say so and we
        will look at a network point near the TV instead.

  - q: Will it work with my TV?
    a:
      - >-
        Any TV with an HDMI input. The eJukebox box goes into a spare port the
        same way a set-top box does, and if you already run several TVs off one
        splitter, the lead goes into that instead and every TV on it follows.
        If your setup is unusual - an old panel, a projector, a screen already
        fed by something else - tell us what it is and we will tell you straight.

  - q: What about pay TV?
    a:
      - >-
        Free-to-air today. Pay TV is in discussion.

  - q: Can we keep the music we have got?
    a:
      - >-
        The screens come with eJukebox music. That is the deal, and it is a
        better deal than the box and the remote: licensed music for two zones,
        updated every week, the request app your patrons use from their table,
        and now every TV in the building from the same phone. The music side
        lives at <a href="https://ejukebox.music">ejukebox.music</a>.

  - q: What does it cost?
    a:
      - >-
        The screens, the TV remote and the sport guide come with an eJukebox
        music subscription. Beyond that it depends on how many screens you have
        and how the room is wired - one TV behind a bar is a different job from
        ten screens across two floors.
      - >-
        So rather than put a number on a web page that turns out to be wrong for
        your venue, tell us about the room and we will talk it through properly.
        One short conversation, and a figure that actually holds.

  - q: Is it Australian?
    a:
      - >-
        Yes. Built, run and supported here by MusicBot Pty Ltd. Send the form
        through and you get one of us coming back to you, not a call centre and
        not a chat window that takes three days.

demo:
  - q: Will it work with my TV?
    a:
      - >-
        Any TV with an HDMI input. The eJukebox box goes into a spare port the
        same way a set-top box does. It powers on with the venue and runs around
        the clock. If your setup is unusual - an old panel, a projector, a
        screen already fed by something else - tell us what it is and we will
        tell you straight whether it will work.

  - q: What about the screens with the footy on?
    a:
      - >-
        Put the footy on with it. Live free-to-air TV is part of the screens now:
        pick the game from the guide, the screen switches to it at kick-off, and
        it comes back to your specials after the whistle. Your specials show
        during the ad breaks as well.
      - >-
        If you would still rather keep this on the spare screen and leave the
        big one alone, that works too. You no longer have to choose.

  - q: What if the internet drops?
    a:
      - >-
        The eJukebox box is built to keep the screen up on its own. A watchdog
        restarts the display if anything stops it, and the box is monitored at
        our end so a problem gets spotted here rather than found by your staff
        on a Saturday night.
      - >-
        Anything new - a fresh guest photo, a slide you just typed, the live TV
        picture - has to come down the connection, so that is the part that
        waits. If the wifi at the far end of the room is patchy, say so on the
        call and we will look at a network point near the TV instead.

  - q: Who decides what photos go up?
    a:
      - >-
        You do, and everything is checked first. Every guest photo is looked over
        for nudity, offensive gestures and anything tasteless
        <strong>before</strong> it can reach the wall. What does not pass is
        held back, not displayed - it never gets as far as the screen.
      - >-
        On top of that, the manager app lets you approve or hide photos one at a
        time or in bulk, push notifications tell you when something needs a
        decision, and you can stop the whole show from your phone from anywhere.

  - q: What if someone wants their photo taken down?
    a:
      - >-
        They tell a staff member and it is gone. The manager app hides a photo
        on its own, or clears a whole table's worth in bulk, and the screen
        catches up straight away.
      - >-
        If you want the wall off altogether for part of the night - during the
        speeches, say - you can stop the show from your phone from anywhere in
        the building.

  - q: Can a staff member break it?
    a:
      - >-
        Not easily. The TV is PIN-locked - press Escape at the screen and you
        get a PIN pad, not a desktop, not a file manager, not somebody's browser
        tabs. There is nothing to click out of and nothing to accidentally
        close.
      - >-
        Staff sign in without passwords, using Google, Microsoft or Apple,
        organised into per-venue teams. You add a manager by email and remove
        someone the day they leave.

  - q: Do I need to buy new screens?
    a:
      - >-
        No. That is the whole point of it - it runs on the screens you already
        own and already pay the power on. A spare HDMI input is the requirement.
        More TVs on the same picture is a lead and the splitter you have. A
        different picture in another room is a small screen box behind that
        wall - hardware once, nothing ongoing.

  - q: Does it need the music system too?
    a:
      - >-
        The screens come with eJukebox music - that is the deal. The same QR
        code that puts a photo on the wall takes song requests, the same phone
        that changes the channel runs the music, and at a function the host
        controls cover both. The music side lives at
        <a href="https://ejukebox.music">ejukebox.music</a>.

  - q: What does it cost?
    a:
      - >-
        The screens, the TV remote and the sport guide come with an eJukebox
        music subscription. Beyond that it depends on how many screens you have
        and how the room is set up - one TV behind a bar is a different job from
        four screens, a function room and a portrait panel at the door.
      - >-
        So rather than put a number on a web page that turns out to be wrong for
        your venue, tell us about the room and we will price it properly. It
        takes one short conversation and you get a figure that actually holds.

  - q: Is it Australian?
    a:
      - >-
        Yes. Built, run and supported here by MusicBot Pty Ltd. Send the form
        through and you get one of us coming back to you, not a call centre and
        not a chat window that takes three days.
