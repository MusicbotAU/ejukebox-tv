  # there is no number on this page, by design, and there is not one anywhere on
  # the site. Marking up a sentence the page cannot back is the one thing that
  # turns FAQ markup into a liability.
  - q: Is it Australian?
    a:
      - >-
        Yes. Built, run and supported here by MusicBot Pty Ltd. Send the form
        through and you get one of us coming back to you, not a call centre and
        not a chat window that takes three days.
