# ---------------------------------------------------------------------------
# THE FAQ - single source of truth for /demo/.
#
# demo.html renders the visible <details> list from this file, and
# _includes/schema.html renders the FAQPage JSON-LD from the same rows. One
# edit, both stay true. A schema answer that no longer matches the visible
# answer is exactly the mismatch that gets structured data ignored.
#
# Each answer is a list of paragraphs. Every paragraph is written as a FOLDED
# BLOCK SCALAR - the "- >-" on its own line with the text indented beneath.
# That is not decoration: several answers contain a colon mid-sentence, and a
# plain inline string would be parsed by YAML as a mapping and emitted into the
# JSON-LD as literal garbage.
#
# Light inline HTML is allowed - <strong> and <a> only - because the visible
# page uses it. The JSON-LD strips it before it is written.
#
# NO PRICES. NO EMAIL ADDRESS. NO PHONE NUMBER. Not in a visible answer and not
# in the markup that is generated from it.
# ---------------------------------------------------------------------------

demo:
  - q: Will it work with my TV?
    a:
      - >-
        Almost certainly. If the screen has a spare HDMI port, the player goes
        into it the same way a set-top box does. It powers on with the venue and
        runs around the clock. If your setup is unusual - an old panel, a
        projector, a screen already fed by something else - tell us what it is
        and we will tell you straight whether it will work.

  - q: What about the screens with the footy on?
    a:
      - >-
        Leave them on the footy. This goes on the spare screen - the one in the
        corner nobody has switched on since the last grand final - so nothing
        has to come off the game.
      - >-
        If the room only has the one screen, you drive it around the fixture:
        specials daily from four till six, then stop the show and hand the panel
        back for the game. Starting and stopping is one tap in the manager app
        from anywhere, and the schedule handles the regular stuff without anyone
        touching it.
      - >-
        If you want both on the same panel through an HDMI switch, tell us how
        it is wired and we will tell you straight whether it will work.

  - q: What if the internet drops?
    a:
      - >-
        The player is built to keep the screen up on its own. A watchdog
        restarts the display if anything stops it, and your player is monitored
        at our end so a problem gets spotted here rather than found by your
        staff on a Saturday night.
      - >-
        Anything new - a fresh guest photo, a slide you just typed - has to come
        down the connection, so that is the part that waits. If the wifi at the
        far end of the room is patchy, say so on the call and we will look at a
        network point near the TV instead.

  - q: Who decides what photos go up?
    a:
      - >-
        You do, and the AI screens everything first. Every guest photo is
        checked for nudity, offensive gestures and anything tasteless
        <strong>before</strong> it can reach the wall. What does not pass is
        held back, not displayed - it never gets as far as the screen.
      - >-
        On top of that, the manager app lets you approve or hide photos one at a
        time or in bulk, push notifications tell you when something needs a
        decision, and you can stop the whole show from your phone from anywhere.

  - q: What if someone wants their photo taken down?
    a:
      - >-
        They tell a staff member and it is gone. The manager app hides a photo
        on its own, or clears a whole table's worth in bulk, and the screen
        catches up straight away.
      - >-
        If you want the wall off altogether for part of the night - during the
        speeches, say - you can stop the show from your phone from anywhere in
        the building.

  - q: Can a staff member break it?
    a:
      - >-
        Not easily. The TV is PIN-locked - press Escape at the screen and you
        get a PIN pad, not a desktop, not a file manager, not somebody's browser
        tabs. There is nothing to click out of and nothing to accidentally
        close.
      - >-
        Staff sign in without passwords, using Google, Microsoft or Apple,
        organised into per-venue teams. You add a manager by email and remove
        someone the day they leave.

  - q: Do I need to buy new screens?
    a:
      - >-
        No. That is the whole point of it - it runs on the screens you already
        own and already pay the power on. A spare HDMI port is the requirement.
        If you later want a second screen, or a portrait one by the door, it
        slots into the same system and gets its own version of every photo.

  - q: Does it need the music system too?
    a:
      - >-
        No. The screen stands on its own and plenty of rooms would only ever
        want the screen.
      - >-
        If you run eJukebox music as well, the two become one thing: the same QR
        code that puts a photo on the wall takes song requests, and at a
        function the host controls cover the music as well as the screen. The
        music side lives at
        <a href="https://ejukebox.music">ejukebox.music</a>.

  - q: What does it cost?
    a:
      - >-
        It depends on how many screens you have and how the room is set up - one
        TV behind a bar is a different job from four screens, a function room
        and a portrait panel at the door.
      - >-
        So rather than put a number on a web page that turns out to be wrong for
        your venue, tell us about the room and we will price it properly. It
        takes one short conversation and you get a figure that actually holds.

