<style>
/* ---------------------------------------------------------------------------
   css-fx.html - page-scoped CSS for /functions/. Prefix fx-.
   Pulled into <head> by the layout via `page_css: css-fx.html` in front matter.
   The pink accent itself lives on body.functions in the layout, NOT here, so
   --accent and --accent-line are already pink on this page. Nothing below
   defines a colour of its own; it only reaches for the existing tokens.
   --------------------------------------------------------------------------- */
.fx-lit{color:var(--accent)}
.fx-quote{margin:0;padding:2px 0 2px clamp(18px,2.4vw,28px);border-left:3px solid var(--accent-line)}
.fx-quote p{font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:1.12;
  font-size:clamp(1.24rem,2.6vw,1.9rem);color:var(--chalk);margin:0}
.fx-quote p + p{margin-top:14px;font-family:var(--body);font-weight:400;font-size:1rem;
  letter-spacing:0;line-height:1.6;color:var(--smoke)}
.fx-host{display:grid;gap:8px;margin-top:14px}
.fx-ctl{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 14px;border-radius:10px;background:var(--room);border:1px solid var(--line)}
.fx-ctl__k{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--smoke)}
.fx-ctl__v{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);white-space:nowrap}
.fx-ctl--now{background:var(--room-3);border-color:var(--line-2)}
.fx-ctl--now .fx-ctl__v{color:var(--chalk);font-family:var(--body);font-size:.95rem;
  letter-spacing:0;text-transform:none}
.fx-crops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);align-items:end}
.fx-crop{margin:0}
.fx-crop__f{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--room-2);
  box-shadow:var(--inset)}
.fx-crop__f .pic{border-radius:0}
.fx-crop figcaption{margin-top:11px;display:block}
.fx-stat{font-family:var(--display);font-weight:800;font-size:clamp(2.1rem,4.6vw,3.1rem);
  letter-spacing:-.045em;line-height:1;color:var(--accent);margin:0 0 8px}
.fx-accent{color:var(--accent)}
/* small print that is prose, not a label - mono is reserved for timings,
   states and labels, so this stays in the body face */
.fx-fine{color:var(--dim);font-size:.92rem;max-width:36em;margin-top:20px}
.fx-fine:last-child{margin-bottom:0}
/* the gate sits in a wide column here, so it runs a size up from the inline
   one on the home page. Sizes only - no new colours, no new behaviour. */
.fx-gate{height:200px;gap:16px;padding:14px}
.fx-gate .gate__wall{grid-template-columns:repeat(2,44px);gap:6px}
.fx-gate .gate__tile{width:88px}
.fx-gate.is-live .gate__tile{width:92px;margin-top:-61px}
@media (max-width:620px){
  .fx-gate{height:170px}
  .fx-gate .gate__tile{width:74px}
  .fx-gate.is-live .gate__tile{width:78px;margin-top:-52px}
  .fx-crops{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fx-crop--sq{grid-column:span 2;max-width:54%}
}
/* the objection, answered: a phone in the aux versus eJukebox on the night */
.fx-vs{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:clamp(22px,3vw,34px)}
.fx-vs__col{border-radius:var(--r);padding:clamp(18px,2.4vw,26px);border:1px solid var(--line);background:var(--room-2)}
.fx-vs__col h3{margin:0 0 12px;font-size:1.15rem}
.fx-vs__col--aux{background:var(--room);border-color:var(--line)}
.fx-vs__col--aux h3{color:var(--dim)}
.fx-vs__col--ej{border-color:var(--accent-line);box-shadow:var(--inset);
  background:linear-gradient(180deg,var(--accent-soft) 0%,var(--room-2) 60%)}
.fx-vs__col--ej h3{color:var(--accent)}
.fx-vs__list{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.fx-vs__list li{display:flex;gap:11px;align-items:flex-start;color:var(--smoke);font-size:.96rem}
.fx-vs__list li::before{content:"\2715";flex:none;font-family:var(--mono);font-size:.8rem;margin-top:3px;color:var(--smoke)}
.fx-vs__list li.is-ok::before{content:"\2713";color:var(--good)}
.fx-vs__col--aux .fx-vs__list li.is-ok{color:var(--chalk)}
.fx-vs__col--ej .fx-vs__list li{color:var(--chalk)}
.fx-verdict{margin:clamp(18px,2.4vw,26px) 0 0;font-family:var(--display);font-weight:700;
  font-size:clamp(1.15rem,2.2vw,1.5rem);letter-spacing:-.02em;color:var(--smoke)}
.fx-verdict strong{color:var(--accent)}
@media (max-width:720px){.fx-vs{grid-template-columns:1fr}}
</style>
