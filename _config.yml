# ejukebox.tv - Jekyll config for GitHub Pages.
# Built server-side by GitHub Pages. Whitelisted plugins only, no Actions, no
# local build step.

title: eJukebox TV
tagline: The screen your venue already owns, running itself
description: >-
  A small player into any spare HDMI port and the screen your venue already owns
  becomes a live display - guest photos on the wall about three seconds after
  they are taken, announcements you type from your phone that design themselves,
  your promos in the rotation, and prompts that teach every new customer how to
  join in.

url: "https://ejukebox.tv"
baseurl: ""
lang: en-AU
timezone: Australia/Perth

# Contact details are read by the nav, the CTA block and the footer.
# No email address is published on this site by design - publishing one
# attracts scrapers. Every route to us is the form, which posts to the Azure
# Function and lands at info@ejukebox.tv / info@ejukebox.music.
contact:
  name: Marc Kean
  company: MusicBot Pty Ltd
  main_site: "https://ejukebox.com.au"

# The eJukebox family. Drives the switcher bar at the top of every page and the
# parent block in the footer. "current" marks which sibling this site is.
family:
  current: "tv"
  parent: "https://ejukebox.com.au"
  music: "https://ejukebox.music"
  tv: "https://ejukebox.tv"

# ---------------------------------------------------------------------------
# THE VIDEO SLOT
# Drop a file into /assets/video/ and set url below. That is the whole job -
# every video stage on the site fills at once and nothing else changes.
# aspect accepts "16/9" for landscape footage or "9/16" for portrait phone
# footage shot at a function. The frame adapts; the page does not reflow.
# ---------------------------------------------------------------------------
video:
  url: ""
  poster: ""
  aspect: "16/9"
  caption: "A Friday night, start to finish."
  # OPTIONAL second caption on the stage. Left empty on purpose - nothing is
  # claimed about where or how the footage was shot unless it is typed here.
  badge: ""
  # Path to a .vtt captions file, if there is one. Empty means no track tag.
  captions: ""

markdown: kramdown

# jekyll-sitemap is on the GitHub Pages whitelist, so it runs server-side with
# no Actions and no local build. It writes /sitemap.xml and /robots.txt.
plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - vendor
  # Working material, not site content. It is the image brief - every file with
  # the page and slot it was made for and a prompt-length description. Kept in
  # the repo, kept off the live site.
  - assets/img/MANIFEST.json
